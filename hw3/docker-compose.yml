services:
  booking-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: booking
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking -d booking"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - booking-data:/var/lib/postgresql/data

  flight-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: flight
      POSTGRES_USER: flight
      POSTGRES_PASSWORD: flight
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flight -d flight"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - flight-data:/var/lib/postgresql/data

  booking-flyway:
    image: flyway/flyway:10-alpine
    command: -url=jdbc:postgresql://booking-postgres:5432/booking -user=booking -password=booking -connectRetries=20 migrate
    depends_on:
      booking-postgres:
        condition: service_healthy
    volumes:
      - ./db/booking:/flyway/sql:ro

  flight-flyway:
    image: flyway/flyway:10-alpine
    command: -url=jdbc:postgresql://flight-postgres:5432/flight -user=flight -password=flight -connectRetries=20 migrate
    depends_on:
      flight-postgres:
        condition: service_healthy
    volumes:
      - ./db/flight:/flyway/sql:ro

  redis-master:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "redispass", "--masterauth", "redispass"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redispass", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - redis-master-data:/data

  redis-replica:
    image: redis:7.4-alpine
    command: ["redis-server", "--replicaof", "redis-master", "6379", "--appendonly", "yes", "--requirepass", "redispass", "--masterauth", "redispass"]
    depends_on:
      redis-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redispass", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - redis-replica-data:/data

  redis-sentinel:
    image: redis:7.4-alpine
    command: ["sh", "-c", "cp /config/sentinel.conf /tmp/sentinel.conf && exec redis-sentinel /tmp/sentinel.conf"]
    depends_on:
      redis-master:
        condition: service_healthy
      redis-replica:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26379", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - ./redis/sentinel.conf:/config/sentinel.conf:ro

  flight-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: flight-service
    environment:
      GRPC_ADDR: ":9090"
      DATABASE_URL: postgres://flight:flight@flight-postgres:5432/flight?sslmode=disable
      GRPC_API_KEY: local-flight-service-key
      REDIS_MASTER_NAME: flight-cache
      REDIS_SENTINEL_ADDRS: redis-sentinel:26379
      REDIS_PASSWORD: redispass
      CACHE_TTL: 5m
    ports:
      - "9090:9090"
    depends_on:
      flight-flyway:
        condition: service_completed_successfully
      redis-sentinel:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/service", "-healthcheck"]
      interval: 5s
      timeout: 3s
      start_period: 3s
      retries: 12

  booking-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: booking-service
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://booking:booking@booking-postgres:5432/booking?sslmode=disable
      FLIGHT_GRPC_ADDR: flight-service:9090
      GRPC_API_KEY: local-flight-service-key
      GRPC_TIMEOUT: 2s
      GRPC_MAX_ATTEMPTS: "3"
      GRPC_RETRY_BACKOFF: 100ms
      BREAKER_FAILURE_THRESHOLD: "5"
      BREAKER_WINDOW_SIZE: "10"
      BREAKER_OPEN_TIMEOUT: 10s
    ports:
      - "8080:8080"
    depends_on:
      booking-flyway:
        condition: service_completed_successfully
      flight-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/service", "-healthcheck"]
      interval: 5s
      timeout: 3s
      start_period: 3s
      retries: 12

volumes:
  booking-data:
  flight-data:
  redis-master-data:
  redis-replica-data:

