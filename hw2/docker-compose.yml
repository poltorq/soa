services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: marketplace
      POSTGRES_USER: marketplace
      POSTGRES_PASSWORD: marketplace
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketplace -d marketplace"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - marketplace-data:/var/lib/postgresql/data

  flyway:
    image: flyway/flyway:10-alpine
    command: -url=jdbc:postgresql://postgres:5432/marketplace -user=marketplace -password=marketplace -connectRetries=20 migrate
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./db/migration:/flyway/sql:ro

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://marketplace:marketplace@postgres:5432/marketplace?sslmode=disable
      JWT_SECRET: local-development-secret-change-me
      ACCESS_TOKEN_TTL: 20m
      REFRESH_TOKEN_TTL: 336h
      ORDER_RATE_LIMIT: 1m
    ports:
      - "8080:8080"
    depends_on:
      flyway:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/marketplace-api", "-healthcheck"]
      interval: 5s
      timeout: 3s
      start_period: 3s
      retries: 10

volumes:
  marketplace-data:

